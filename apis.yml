aid: anywhere-2-go
name: Anywhere 2 Go
description: >-
  Anywhere 2 Go Co., Ltd. is a Bangkok, Thailand insurtech company and the maker of Claim Di, a mobile
  application ecosystem that streamlines motor insurance claims and vehicle inspection between drivers,
  independent surveyors, and insurance companies. Its flagship "Shake and Go" (K4K) feature lets two
  Claim Di users resolve minor accidents on the spot, while Emergency Alert, self-service Car Inspection,
  photo-based Non-Accident Claims, and the Claim Di Bike surveyor-dispatch program cut claim processing
  time and help insurers reduce fraud. The company is a 500 Global portfolio company. Claim Di is a
  consumer/B2B mobile product (iOS and Android); no public developer API or documentation surface was
  found during enrichment.
